<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ec" />
    <meta
      name="description"
      content="TrackAJob — track every job application and tailor an ATS-safe resume to each job post."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Apply the saved theme before first paint. Without this the page renders
      light and then flips to dark, which looks like a bug. Kept inline and
      tiny on purpose: it must run before the stylesheet paints.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('trackajob-theme')
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#14140f' : '#f7f4ec')
        } catch (e) {
          /* storage blocked: light is the default */
        }
      })()
    </script>
    <title>TrackAJob</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
